name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute password hash
        id: hash
        run: |
          HASH=$(echo -n "${{ secrets.ARC_GRAPHS_PASSWORD }}" | sha256sum | awk '{print $1}')
          echo "value=$HASH" >> $GITHUB_OUTPUT

      - name: Inject hash into HTML
        run: |
          # Substitute in every page that carries the placeholder, rather than a
          # hand-maintained list. The list had drifted in both directions: two
          # entries no longer contained the placeholder, while two pages that did
          # were missing from it, leaving their password permanently unmatchable.
          FILES=$(grep -rl PLACEHOLDER_HASH --include='*.html' .)
          if [ -z "$FILES" ]; then echo "No PLACEHOLDER_HASH found - nothing to inject."; exit 0; fi
          echo "$FILES"
          echo "$FILES" | xargs sed -i "s/PLACEHOLDER_HASH/${{ steps.hash.outputs.value }}/g"
          # Fail the deploy rather than publish a page nobody can unlock.
          if grep -rq PLACEHOLDER_HASH --include='*.html' .; then
            echo "PLACEHOLDER_HASH still present after substitution:" >&2
            grep -rl PLACEHOLDER_HASH --include='*.html' . >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
        id: deployment
