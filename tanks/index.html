<title>ARC Tank Monitoring</title>
<script>
(function(){
  if(sessionStorage.getItem('arc_auth')==='1')return;
  var s=document.createElement('style');
  s.textContent='body{visibility:hidden}';
  document.head.appendChild(s);
  document.addEventListener('DOMContentLoaded',function(){
    s.remove();
    var o=document.createElement('div');
    o.id='pw-overlay';
    o.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:#111;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#fff;';
    o.innerHTML='<div style="text-align:center"><div style="font-size:20px;margin-bottom:20px;font-weight:500">Enter password</div><input id="pw-in" type="password" placeholder="Password" style="padding:10px 14px;font-size:16px;background:#222;color:#fff;border:1px solid #555;border-radius:4px;width:220px;outline:none;display:block;margin:0 auto 8px"><div id="pw-err" style="color:#f66;font-size:13px;height:20px"></div><button id="pw-btn" style="padding:10px 28px;background:#fff;color:#111;border:none;border-radius:4px;font-size:15px;cursor:pointer;margin-top:4px">Enter</button></div>';
    document.body.appendChild(o);
    document.getElementById('pw-in').focus();
    async function check(){
      var val=document.getElementById('pw-in').value;
      var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(val));
      var hash=Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
      if(hash==='52e32618b274e60e320245f222a7a50dd485ea0e3edcf48cb2873977502b5f19'){
        sessionStorage.setItem('arc_auth','1');
        o.remove();
      }else{
        document.getElementById('pw-err').textContent='Incorrect password';
      }
    }
    document.getElementById('pw-btn').addEventListener('click',check);
    document.getElementById('pw-in').addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  });
})();
</script>

<style>
/* Ubuntu, self-hosted so the page works with no network at all.
   Ubuntu Font Licence 1.0 — see survey/README.md. BUILD_INLINE_FONTS */
@font-face{font-family:'Ubuntu';font-style:normal;font-weight:300;font-display:swap;src:url(fonts/ubuntu-300.woff2) format('woff2')}
@font-face{font-family:'Ubuntu';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ubuntu-400.woff2) format('woff2')}
@font-face{font-family:'Ubuntu';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ubuntu-500.woff2) format('woff2')}
@font-face{font-family:'Ubuntu';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/ubuntu-700.woff2) format('woff2')}
:root{
  --green:#1a6b4a; --green-d:#125239; --green-l:#e7f2ec;
  --ink:#1c2321; --muted:#5d6b66; --line:#d6ded9; --bg:#f4f7f5; --card:#fff;
  --s3:#2b6cb0; --s2:#3182ce; --s1:#5b9bd5; --s0:#38a169;
  --p1:#d99a3c; --p2:#ed8936; --p3:#e53e3e;
  --yes:#2f855a; --no:#b03a3a; --brown:#8a5a2b;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Ubuntu',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  font-size:17px;line-height:1.35;overscroll-behavior:none;
}
button,input,textarea,select{font-family:inherit}
.hide{display:none !important}

/* ---------- shell ---------- */
#app{min-height:100%;min-height:100dvh;display:flex;flex-direction:column}
#bar{
  background:var(--green);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
#bar .who{font-size:15px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar .step{font-size:14px;opacity:.85;font-variant-numeric:tabular-nums}
#bar button{
  background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:10px;
  padding:8px 12px;font-size:14px;font-weight:500;cursor:pointer;
}
#bar button:active{background:rgba(255,255,255,.3)}
#prog{height:6px;background:rgba(0,0,0,.12);flex-shrink:0}
#prog>i{display:block;height:100%;background:#8fd6b4;width:0;transition:width .25s ease}

#stage{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 14px 8px;display:flex;justify-content:center}
#stage>.wrap{width:100%;max-width:960px;display:flex;flex-direction:column}

#foot{
  flex-shrink:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:10px;background:var(--bg);border-top:1px solid var(--line);
}
#foot button{
  flex:1;border:none;border-radius:14px;padding:18px 14px;font-size:19px;font-weight:500;cursor:pointer;
}
#btn-back{flex:0 0 33%;background:#e3e9e6;color:var(--muted)}
#btn-next{background:var(--green);color:#fff;box-shadow:0 2px 0 var(--green-d)}
#btn-next:disabled{background:#c3cdc8;box-shadow:none;color:#fff}
#btn-next:active:not(:disabled){transform:translateY(1px);box-shadow:none}

/* ---------- question ---------- */
.sec{
  display:inline-block;align-self:flex-start;background:var(--green-l);color:var(--green-d);
  font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;margin-bottom:12px;
}
.q-sw{font-size:29px;font-weight:500;line-height:1.2;margin-bottom:4px}
.q-en{font-size:20px;font-weight:300;color:var(--muted);line-height:1.25;margin-bottom:4px}
.q-hint{font-size:15px;color:var(--muted);margin-top:8px;font-style:italic}
.q-head{margin-bottom:20px}

/* option grids */
.opts{display:grid;gap:11px;margin-bottom:6px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.gauto{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

.opt{
  background:var(--card);border:3px solid var(--line);border-radius:var(--r);
  padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  gap:8px;text-align:center;transition:border-color .12s,background .12s,transform .08s;
  color:var(--muted);min-height:118px;justify-content:center;
}
.opt:active{transform:scale(.97)}
.opt svg{width:56px;height:56px;flex-shrink:0;display:block}
.opt .lab-sw{font-size:18px;font-weight:500;color:var(--ink);line-height:1.15}
.opt .lab-en{font-size:14px;font-weight:300;color:var(--muted);line-height:1.15}
.opt.on{border-color:currentColor;background:#fff;box-shadow:0 0 0 4px rgba(0,0,0,.06)}
.opt.on{box-shadow:0 0 0 4px color-mix(in srgb,currentColor 16%,transparent)}
.opt.on .lab-sw{color:currentColor}

/* 0–5 scale (Q12) */
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.scale .opt{padding:12px 4px;min-height:150px;gap:6px;justify-content:flex-start}
.scale .opt svg{width:52px;height:52px}
.scale .opt .lab-sw{font-size:14px}
.scale .opt .lab-en{font-size:12px}
.scale .num{
  font-size:15px;font-weight:700;color:currentColor;border-radius:999px;
  background:#eef1f0;
  background:color-mix(in srgb,currentColor 18%,#fff);
  padding:2px 11px;font-variant-numeric:tabular-nums;line-height:1.3;
}
.scale .txt{display:flex;flex-direction:column;align-items:center;gap:4px}

/* yes / no */
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn .opt{min-height:140px}
.yn .opt svg{width:64px;height:64px}
.yn .opt .lab-sw{font-size:24px}

/* text */
textarea,input[type=text]{
  width:100%;border:3px solid var(--line);border-radius:var(--r);padding:14px;
  font-size:21px;background:#fff;color:var(--ink);outline:none;resize:vertical;
}
textarea:focus,input[type=text]:focus{border-color:var(--green)}
textarea{min-height:150px;line-height:1.4}

/* number (Q15 depth) */
.numrow{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 18px;font-size:22px;color:var(--muted)}
.numrow input{width:170px;text-align:center;font-size:48px;font-weight:500;padding:10px;font-variant-numeric:tabular-nums}

/* month / year (Q19) */
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}
.mgrid .chip,.ygrid .chip{text-align:center;padding:12px 6px;border-radius:14px;font-size:17px}
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mlab{font-size:15px;font-weight:500;color:var(--muted);margin:4px 0 8px}

/* chips (tank / rain / language) */
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px}
.chip{
  background:#fff;border:3px solid var(--line);border-radius:999px;padding:12px 20px;
  font-size:19px;cursor:pointer;color:var(--ink);
}
.chip.on{border-color:var(--green);background:var(--green-l);color:var(--green-d);font-weight:500}
.chips.tanks .chip{min-width:84px;font-size:26px;font-weight:500;padding:12px 24px}

/* ---------- start / review / done ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.panel h2{font-size:22px;font-weight:500;margin-bottom:4px}
.panel p.sub{font-size:15px;color:var(--muted);margin-bottom:14px}
.field{margin-bottom:16px}
.field>label{display:block;font-size:15px;font-weight:500;margin-bottom:8px;color:var(--muted)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo .mark{width:46px;height:46px;border-radius:12px;background:var(--green);display:grid;place-items:center;flex-shrink:0}
.logo .mark svg{width:30px;height:30px;color:#fff}
.logo h1{font-size:25px;font-weight:500;line-height:1.15}
.logo .sub{font-size:14px;color:var(--muted)}
.instr p{font-size:15px;line-height:1.45;margin-bottom:8px}
.instr p.en{color:var(--muted);font-weight:300}
.instr summary{cursor:pointer;font-weight:500;font-size:15px;color:var(--green-d)}
.instr[open] summary{margin-bottom:10px}

.review{list-style:none}
.review li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px;align-items:flex-start}
.review li:last-child{border-bottom:none}
.review .rq{flex:1;color:var(--muted)}
.review .ra{font-weight:500;text-align:right;max-width:52%;word-break:break-word}
.review .ra.empty{color:#b4bfba;font-weight:300}
.review li button{background:none;border:none;color:var(--green);font-size:14px;cursor:pointer;padding:2px 4px;text-decoration:underline}

.done-mark{width:110px;height:110px;margin:26px auto 18px;display:block;color:var(--green)}
.done h2{text-align:center;font-size:30px;font-weight:500;margin-bottom:8px}
.done p{text-align:center;color:var(--muted);font-size:17px;margin-bottom:22px;white-space:pre-line;word-break:break-word}

.note{background:#fff8e6;border:1px solid #e8d49a;border-radius:12px;padding:12px 14px;font-size:14.5px;color:#6b5626;margin-bottom:14px}
.note.bad{background:#fdeceb;border-color:#e8b0ab;color:#83302a}
.note.ok{background:var(--green-l);border-color:#a9cfbc;color:var(--green-d)}
.queue-badge{background:#fff;color:var(--green-d);border-radius:999px;padding:3px 9px;font-size:13px;font-weight:500}
.offdot{background:rgba(0,0,0,.22);color:#ffd9a0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;white-space:nowrap}

.mini{display:flex;gap:8px;flex-wrap:wrap}
.mini button{
  background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 14px;
  font-size:14px;cursor:pointer;color:var(--muted);
}
.mini button:active{background:var(--green-l)}

/* ---------- responsive ---------- */
@media (max-width:820px){
  .scale{grid-template-columns:repeat(3,1fr)}
  .mgrid{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:560px){
  body{font-size:16px}
  .q-sw{font-size:25px}
  .q-en{font-size:17px}
  .scale{grid-template-columns:repeat(2,1fr)}
  .scale .opt{min-height:112px}
  .g3{grid-template-columns:repeat(2,1fr)}
  .mgrid{grid-template-columns:repeat(3,1fr)}
  .numrow input{font-size:40px;width:140px}
}
</style>
</head>

  /* Must match SUBMIT_TOKEN in apps-script.gs */

}

   Colour follows good/bad rather than yes/no so a glance at the screen reads right. */
function YNbad(){
  return [{v:1, sw:'Ndiyo', en:'Yes', icon:'i-yes', c:'var(--no)'},
          {v:0, sw:'Hapana',en:'No',  icon:'i-no',  c:'var(--yes)'}];

  {v:2, sw:'Kali',   en:'Strong',   icon:'i-smell-strong', c:'var(--p3)'}
];
var MONTHS = [

  'c19_last_raked','c20_compost_look',
  'd_yearly_reset','d21_compost_removed','d22_raked','d23_layers_replaced','d24_metal_sheet',
  'e_notes','duration_seconds','app_version','device'];

/* ============================================================
   state
   ============================================================ */
var S = {
  screen : 'start',
  lang   : 'both',       // both | sw | en
  meta   : {tank:'', checked_by:'', date:'', time:''},
  ans    : {},           // also holds rain_2days, set on the start screen
  i      : 0,
  started: 0,
  savedAs: ''            // filename written by the 'file' sink
};

var $wrap=document.getElementById('wrap'), $foot=document.getElementById('foot'),
    $back=document.getElementById('btn-back'), $next=document.getElementById('btn-next'),
    $bar=document.getElementById('bar'), $who=document.getElementById('who'),
    $stepno=document.getElementById('stepno'), $prog=document.getElementById('progbar'),
    $badge=document.getElementById('qbadge'), $stage=document.getElementById('stage');

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function pad(n){ return (n<10?'0':'')+n; }
function today(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function now(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function icon(id,cls){ return '<svg class="'+(cls||'')+'"><use href="#'+id+'"/></svg>'; }
function T(sw,en){ return S.lang==='en' ? en : (S.lang==='sw' ? sw : sw+' / '+en); }

function qTitleHTML(q){
  if (S.lang==='sw') return '<div class="q-sw">'+esc(q.sw)+'</div>';
  if (S.lang==='en') return '<div class="q-sw">'+esc(q.en)+'</div>';
  return '<div class="q-sw">'+esc(q.sw)+'</div><div class="q-en">'+esc(q.en)+'</div>';
}
function qHintHTML(q){
  if (!q.hintSw && !q.hintEn) return '';
  var txt = S.lang==='en' ? esc(q.hintEn) : (S.lang==='sw' ? esc(q.hintSw) : esc(q.hintSw)+' &nbsp;·&nbsp; '+esc(q.hintEn));
  return '<div class="q-hint">'+txt+'</div>';
}
function optLabelHTML(o){
  if (S.lang==='sw') return '<span class="lab-sw">'+esc(o.sw)+'</span>';
  if (S.lang==='en') return '<span class="lab-sw">'+esc(o.en)+'</span>';
  return '<span class="lab-sw">'+esc(o.sw)+'</span><span class="lab-en">'+esc(o.en)+'</span>';
}

/* ============================================================
   which questions apply
   ============================================================ */
function steps(){
  return QS.filter(function(q){
    if (q.showIf && !q.showIf(S.ans)) return false;
    return true;
  });
}

function answered(q){
  var v = S.ans[q.id];
  if (q.type==='multi')  return Array.isArray(v) && v.length>0;
  if (q.type==='text')   return typeof v==='string' && v.trim()!=='';
  if (q.type==='month')  return !!(v && v.y && v.m);
  if (q.type==='number') return typeof v==='number' && isFinite(v);
  return v !== undefined && v !== null && v !== '';
}

/* ============================================================
   persistence
   ============================================================ */
function saveDraft(){
  try{ localStorage.setItem(LS_DRAFT, JSON.stringify({
    lang:S.lang, meta:S.meta, ans:S.ans, i:S.i, started:S.started, at:Date.now()
  })); }catch(e){}
}
function clearDraft(){ try{ localStorage.removeItem(LS_DRAFT); }catch(e){} }
function loadDraft(){ try{ var s=localStorage.getItem(LS_DRAFT); return s?JSON.parse(s):null; }catch(e){ return null; } }
function prefs(){ try{ return JSON.parse(localStorage.getItem(LS_PREFS))||{}; }catch(e){ return {}; } }
function savePrefs(p){ try{ localStorage.setItem(LS_PREFS, JSON.stringify(p)); }catch(e){} }
function queue(){ try{ return JSON.parse(localStorage.getItem(LS_QUEUE))||[]; }catch(e){ return []; } }
function setQueue(q){ try{ localStorage.setItem(LS_QUEUE, JSON.stringify(q)); }catch(e){} paintBadge(); paintDoneStatus(); }
function paintBadge(){
  if (CFG.sink === 'file'){ $badge.classList.add('hide'); return; }
  var n = queue().length;
  $badge.classList.toggle('hide', n===0);
  $badge.textContent = n + ' ⏳';
  $badge.title = n+' not yet sent';
}

/* ============================================================
   chrome
   ============================================================ */
function paintChrome(){
  var st = steps(), on = S.screen==='q';
  $stepno.textContent = on ? (S.i+1)+' / '+st.length : '';
  $prog.style.width = on ? ((S.i)/st.length*100)+'%' : (S.screen==='done'?'100%':'0%');
  var bits=[];
  if (S.meta.tank) bits.push((S.lang==='en'?'Tank ':'Tangi ')+S.meta.tank);
  if (S.meta.checked_by && S.screen!=='start') bits.push(S.meta.checked_by);
  $who.textContent = bits.join(' · ');
  $foot.classList.toggle('hide', S.screen==='start' || S.screen==='done');
  paintBadge();
}

/* ============================================================
   screens
   ============================================================ */
function render(){
  if (S.screen==='start')  renderStart();
  else if (S.screen==='q') renderQ();
  else if (S.screen==='review') renderReview();
  else if (S.screen==='done')   renderDone();
  paintChrome();
  $stage.scrollTop = 0;
}

/* ---------- start ---------- */
function renderStart(){
  var p = prefs();
  if (p.lang) S.lang = p.lang;
  if (p.checked_by && !S.meta.checked_by) S.meta.checked_by = p.checked_by;

  if (!S.meta.time) S.meta.time = now();

  var draft = loadDraft();
  var hasDraft = draft && draft.ans && Object.keys(draft.ans).some(function(k){ return k!=='rain_2days'; });

  var inputCss = 'flex:1;border:3px solid var(--line);border-radius:16px;padding:14px;font-size:18px;background:#fff;color:var(--ink);outline:none';

  $wrap.innerHTML =
  '<div class="logo"><div class="mark">'+icon('i-tank')+'</div>'+

     (draft.meta&&draft.meta.tank?' for tank '+esc(draft.meta.tank):'')+'.<div class="mini" style="margin-top:10px">'+

    '<p>Tumia karatasi moja kwa kila tangi. Fanya <b>Sehemu A, B na C kila mwezi</b>. Fanya <b>Sehemu D mara moja kwa mwaka tu</b>. '+
      'Jibu <b>Sehemu A kifuniko kikiwa bado kimefungwa</b>, kisha inua kifuniko kwa Sehemu B. Vaa glavu na tumia kijiti; usiguse kilichomo ndani ya tangi kwa mikono. '+
      'Hakuna haja ya kupiga picha, <b>isipokuwa kama kitu kinatia wasiwasi sana</b>.</p>'+
    '<p class="en">Use one sheet for each tank. Do <b>Sections A, B and C every month</b>. Do <b>Section D once a year</b> only. '+
      'Answer <b>Section A with the lid still on</b>, then lift the lid for Section B. Wear gloves and use a stick; do not touch the contents of the tank with your hands. '+
      'You do not need to take photos, <b>only if something looks very worrying</b>.</p>'+
  '</details>'+

  '<div class="panel">'+
    '<div class="field"><label>Lugha / Language</label>'+
      '<div class="chips" id="lang">'+
        ['sw|Kiswahili','both|Zote mbili / Both','en|English'].map(function(s){
          var b=s.split('|'); return '<button class="chip'+(S.lang===b[0]?' on':'')+'" data-lang="'+b[0]+'">'+b[1]+'</button>';
        }).join('')+
      '</div></div>'+

    '<div class="field"><label>Tangi / Tank</label>'+
      '<div class="chips tanks" id="tank">'+CFG.tanks.map(function(t){
        return '<button class="chip'+(S.meta.tank===t?' on':'')+'" data-tank="'+esc(t)+'">'+esc(t)+'</button>';
      }).join('')+'</div></div>'+

    '<div class="field"><label>Aliyekagua / Checked by</label>'+
      '<input type="text" id="f-checked" placeholder="Jina lako / Your name" value="'+esc(S.meta.checked_by)+'"></div>'+

    '<div class="field"><label>Tarehe na saa / Date and time</label>'+
      '<div style="display:flex;gap:10px">'+
        '<input type="date" id="f-date" value="'+esc(S.meta.date)+'" style="'+inputCss+'">'+
        '<input type="time" id="f-time" value="'+esc(S.meta.time)+'" style="'+inputCss+'">'+
      '</div></div>'+

    '<div class="field"><label>Mvua kubwa siku 2 zilizopita? / Heavy rain in last 2 days?</label>'+
      '<div class="chips" id="rain">'+
        '<button class="chip'+(S.ans.rain_2days===1?' on':'')+'" data-rain="1">Ndiyo / Yes</button>'+
        '<button class="chip'+(S.ans.rain_2days===0?' on':'')+'" data-rain="0">Hapana / No</button>'+
      '</div></div>'+
  '</div>'+

  '<button id="btn-start" style="border:none;border-radius:16px;padding:22px;font-size:23px;font-weight:500;background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d);cursor:pointer;width:100%">Anza / Start</button>'+

  (CFG.endpoint || CFG.sink==='file' ? '' :
    '<div class="note" style="margin-top:14px">No Google Sheet is connected yet. Answers are saved on this device and can be exported with the button above. See <b>tanks/README.md</b>.</div>');

  document.getElementById('instr').addEventListener('toggle', function(){

  document.getElementById('lang').addEventListener('click', function(e){
    var b=e.target.closest('[data-lang]'); if(!b) return;
    S.lang=b.dataset.lang; var p=prefs(); p.lang=S.lang; savePrefs(p); paintOnline(); render();
  });

    var b=e.target.closest('[data-tank]'); if(!b) return;

      S.screen='q'; render();

function alertish(msg){
  var n=document.createElement('div');
  n.textContent=msg;
  n.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b2f2d;color:#fff;padding:14px 20px;border-radius:12px;font-size:16px;z-index:9999;max-width:88%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25);pointer-events:none';
  document.body.appendChild(n);
  setTimeout(function(){ n.remove(); }, 2600);
}

/* ---------- a question ---------- */
function renderQ(){
  var st = steps();
  if (S.i >= st.length){ S.screen='review'; render(); return; }
  var q = st[S.i];

  var sec = SEC_NAME[q.sec];
  var secTxt = S.lang==='en' ? sec.en : sec.sw;
  var html = '<div class="sec">'+esc(secTxt)+'</div><div class="q-head">'+qTitleHTML(q)+qHintHTML(q)+'</div>';

  if (q.type==='scale')       html += scaleHTML(q);
  else if (q.type==='choice') html += choiceHTML(q);
  else if (q.type==='multi')  html += multiHTML(q);
  else if (q.type==='text')   html += textHTML(q);
  else if (q.type==='number') html += numberHTML(q);
  else if (q.type==='month')  html += monthHTML(q);

  $wrap.innerHTML = html;
  wire(q);

  $back.disabled = false;
  $next.textContent = (S.i===st.length-1)
    ? (S.lang==='en' ? 'Check answers' : 'Angalia majibu')
    : (S.lang==='en' ? 'Next' : 'Endelea');
  $next.disabled = !(answered(q) || q.optional);
}

function optHTML(q,o,on){
  return '<button class="opt'+(on?' on':'')+'" data-v="'+esc(o.v)+'" style="color:'+(o.c||'var(--green)')+'">'+
         icon(o.icon)+optLabelHTML(o)+'</button>';
}
function scaleHTML(q){
  var cur = S.ans[q.id];
  return '<div class="opts scale">'+q.opts.map(function(o){
    return '<button class="opt'+(cur===o.v?' on':'')+'" data-v="'+o.v+'" style="color:'+o.c+'">'+
           icon(o.icon)+'<span class="txt"><span class="num">'+o.v+'</span>'+(o.sw?optLabelHTML(o):'')+'</span></button>';
  }).join('')+'</div>';
}
function choiceHTML(q){
  var cur = S.ans[q.id];
  var cls = q.layout==='yn' ? 'yn' : 'opts '+(q.layout||'gauto');
  return '<div class="'+cls+'">'+q.opts.map(function(o){
    return optHTML(q,o,String(cur)===String(o.v));
  }).join('')+'</div>';
}
function multiHTML(q){
  var cur = S.ans[q.id]||[];
  return '<div class="opts '+(q.layout||'gauto')+'">'+q.opts.map(function(o){
    return optHTML(q,o,cur.indexOf(o.v)>-1);
  }).join('')+'</div>';
}
function textHTML(q){
  var v = S.ans[q.id]||'';
  return '<textarea id="ta" placeholder="'+(S.lang==='en'?'Type here…':'Andika hapa…')+'">'+esc(v)+'</textarea>';
}
function numberHTML(q){
  var v = S.ans[q.id];
  return '<div class="numrow"><span>'+(S.lang==='en'?'about':'takriban')+'</span>'+
    '<input type="text" id="num" inputmode="decimal" autocomplete="off" value="'+(v===undefined?'':esc(v))+'">'+
    '<span>'+esc(q.unit||'')+'</span></div>';
}
function monthHTML(q){
  var v = S.ans[q.id]||{};
  var y0 = new Date().getFullYear();
  return '<div class="mlab">'+T('Mwezi','Month')+'</div>'+
    '<div class="mgrid" id="mgrid">'+MONTHS.map(function(m,k){
      var mm = pad(k+1);
      return '<button class="chip'+(v.m===mm?' on':'')+'" data-m="'+mm+'">'+(S.lang==='en'?m[1]:m[0])+'</button>';
    }).join('')+'</div>'+
    '<div class="mlab">'+T('Mwaka','Year')+'</div>'+
    '<div class="ygrid" id="ygrid">'+[y0, y0-1, y0-2].map(function(y){
      return '<button class="chip'+(v.y===String(y)?' on':'')+'" data-y="'+y+'">'+y+'</button>';
    }).join('')+'</div>';
}

function wire(q){
  $wrap.onclick = null;
  if (q.type==='scale' || q.type==='choice'){
    $wrap.onclick = function(e){
      var b=e.target.closest('.opt'); if(!b) return;
      var o = q.opts.filter(function(x){ return String(x.v)===b.dataset.v; })[0];
      S.ans[q.id] = o.v;
      Array.prototype.forEach.call($wrap.querySelectorAll('.opt'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      $next.disabled = false;
      saveDraft();
      setTimeout(function(){ if (S.screen==='q' && steps()[S.i]===q) go(1); }, 280);
    };
  }
  if (q.type==='multi'){
    $wrap.onclick = function(e){
      var b=e.target.closest('.opt'); if(!b) return;
      var o = q.opts.filter(function(x){ return String(x.v)===b.dataset.v; })[0];
      var cur = (S.ans[q.id]||[]).slice();
      var k = cur.indexOf(o.v);
      if (k>-1){
        cur.splice(k,1);
      } else if (o.exclusive){
        cur = [o.v];                       // "None" stands alone
      } else {
        cur = cur.filter(function(v){       // anything else clears it
          var x = q.opts.filter(function(y){ return y.v===v; })[0];
          return !(x && x.exclusive);
        });
        cur.push(o.v);
      }
      S.ans[q.id]=cur;
      Array.prototype.forEach.call($wrap.querySelectorAll('.opt'), function(el){
        el.classList.toggle('on', cur.map(String).indexOf(el.dataset.v) > -1);
      });
      $next.disabled = !(cur.length>0 || q.optional);
      saveDraft();
    };
  }
  if (q.type==='text'){
    var ta=document.getElementById('ta');
    ta.addEventListener('input', function(){
      S.ans[q.id]=this.value;
      $next.disabled = !(this.value.trim()!=='' || q.optional);
      saveDraft();
    });
    if (!('ontouchstart' in window)) ta.focus();
  }
  if (q.type==='number'){
    var inp=document.getElementById('num');
    inp.addEventListener('input', function(){
      var t=this.value.replace(',','.').trim();
      var n=parseFloat(t);
      if (t==='' || !isFinite(n) || n<0) delete S.ans[q.id]; else S.ans[q.id]=n;
      $next.disabled = !(answered(q) || q.optional);
      saveDraft();
    });
    if (!('ontouchstart' in window)) inp.focus();
  }
  if (q.type==='month'){
    $wrap.onclick = function(e){
      var b=e.target.closest('[data-m],[data-y]'); if(!b) return;
      var v = Object.assign({}, S.ans[q.id]||{});
      if (b.dataset.m) v.m = (v.m===b.dataset.m) ? '' : b.dataset.m;
      if (b.dataset.y) v.y = (v.y===b.dataset.y) ? '' : b.dataset.y;
      S.ans[q.id]=v;
      Array.prototype.forEach.call($wrap.querySelectorAll('[data-m]'), function(el){ el.classList.toggle('on', el.dataset.m===v.m); });
      Array.prototype.forEach.call($wrap.querySelectorAll('[data-y]'), function(el){ el.classList.toggle('on', el.dataset.y===v.y); });
      $next.disabled = !(answered(q) || q.optional);
      saveDraft();
    };
  }
}

function go(d){
  var st = steps();
  if (d>0){
    var q = st[S.i];
    if (q && !answered(q) && !q.optional){ return; }
    if (S.i >= st.length-1){ S.screen='review'; saveDraft(); render(); return; }
    S.i++;
  } else {
    if (S.i===0){ S.screen='start'; saveDraft(); render(); return; }
    S.i--;
  }
  saveDraft(); render();
}

/* ---------- review ---------- */
function monthLabel(v){
  if (!v || !v.m || !v.y) return null;
  var m = MONTHS[parseInt(v.m,10)-1];
  return (S.lang==='en' ? m[1] : m[0]) + ' ' + v.y;
}
function shortAnswer(q){
  var v = S.ans[q.id];
  if (q.type==='month') return monthLabel(v);
  if (v===undefined || v===null || v==='' || (Array.isArray(v)&&!v.length)) return null;
  if (q.type==='text')   return v;
  if (q.type==='number') return v + ' ' + (q.unit||'');
  if (q.type==='multi'){
    return v.map(function(x){
      var o=q.opts.filter(function(y){return y.v===x;})[0];
      return o ? (S.lang==='en'?o.en:o.sw) : x;
    }).join(', ');
  }
  var o = q.opts.filter(function(y){ return String(y.v)===String(v); })[0];
  if (!o) return String(v);
  var lab = S.lang==='en' ? o.en : o.sw;
  return q.type==='scale' ? (String(o.v) + (lab ? '  '+lab : '')) : lab;
}

function renderReview(){
  var st = steps();
  var rows = st.map(function(q,k){
    var a = shortAnswer(q);
    var qt = S.lang==='en' ? q.en : q.sw;
    return '<li><span class="rq">'+esc(qt)+'</span>'+
      '<span class="ra'+(a?'':' empty')+'">'+esc(a || '—')+'</span>'+
      '<button data-k="'+k+'">'+(S.lang==='en'?'edit':'badili')+'</button></li>';
  }).join('');

  var q = queue().length;
  var rain = S.ans.rain_2days===1 ? T('Mvua kubwa','Heavy rain') : T('Hakuna mvua kubwa','No heavy rain');
  $wrap.innerHTML =
    '<div class="sec">'+(S.lang==='en'?'Check before sending':'Angalia kabla ya kutuma')+'</div>'+
    '<div class="q-head">'+
      '<div class="q-sw">'+(S.lang==='en'?'Tank ':'Tangi ')+esc(S.meta.tank)+'</div>'+
      '<div class="q-en">'+esc(S.meta.date)+' &middot; '+esc(S.meta.time)+' &middot; '+esc(S.meta.checked_by)+' &middot; '+esc(rain)+'</div></div>'+
    (q ? '<div class="note">'+q+' '+(S.lang==='en'?'earlier sheet(s) still waiting to be sent.':'rekodi zilizopita bado hazijatumwa.')+'</div>' : '')+
    '<div class="panel"><ul class="review" id="rev">'+rows+'</ul></div>';

  document.getElementById('rev').addEventListener('click', function(e){
    var b=e.target.closest('[data-k]'); if(!b) return;
    S.i = parseInt(b.dataset.k,10); S.screen='q'; render();
  });

  $back.disabled=false;
  $next.disabled=false;
  $next.textContent = S.lang==='en' ? 'Send' : 'Tuma';
}

/* ---------- done ---------- */
function doneStatusText(){
  if (CFG.sink === 'file'){
    return (S.lang==='en'
      ? 'Saved on this computer as:\n' + (S.savedAs||'') + '\nLook in your Downloads folder.'
      : 'Imehifadhiwa kwenye kompyuta hii kama:\n' + (S.savedAs||'') + '\nAngalia katika folda ya Downloads.');
  }
  var n = queue().length;
  if (n === 0) return S.lang==='en' ? 'Sent.' : 'Imetumwa.';
  if (!CFG.endpoint) return S.lang==='en' ? 'Saved on this device. Use Export data to send it.'
                                          : 'Imehifadhiwa kwenye kifaa hiki. Tumia Hifadhi nakala kuituma.';
  if (navigator.onLine) return S.lang==='en' ? 'Saved. Sending…' : 'Imehifadhiwa. Inatumwa…';
  return S.lang==='en' ? 'Saved on this device. It will send itself when there is internet.'
                       : 'Imehifadhiwa kwenye kifaa hiki. Itatumwa yenyewe kukiwa na intaneti.';
}
function paintDoneStatus(){
  var el = document.getElementById('done-status');
  if (el) el.textContent = doneStatusText();
}
function renderDone(){
  $wrap.innerHTML =
    '<div class="done">'+icon('i-done','done-mark')+
    '<h2>'+(S.lang==='en'?'Thank you!':'Asante sana!')+'</h2>'+
    '<p id="done-status">'+esc(doneStatusText())+'</p>'+
    '<button id="btn-again" style="border:none;border-radius:16px;padding:20px;font-size:21px;font-weight:500;background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d);cursor:pointer;width:100%">'+
      (S.lang==='en'?'Next tank':'Tangi lingine')+'</button>'+
    '<div class="mini" style="margin-top:18px;justify-content:center">'+
      '<button id="btn-export2">'+(S.lang==='en'?'Export data':'Hifadhi nakala')+' ('+queue().length+')</button></div>'+
    '</div>';
  document.getElementById('btn-again').addEventListener('click', function(){
    /* Same checker, same day, same rain: only the tank and the answers change. */
    var rain = S.ans.rain_2days;
    S.ans={rain_2days:rain}; S.i=0; S.meta.tank=''; S.meta.time=now();
    S.screen='start'; clearDraft(); render();
  });
  document.getElementById('btn-export2').addEventListener('click', exportQueue);
}

/* ============================================================
   submission
   ============================================================ */
function buildPayload(){
  var p = {};
  p.submitted_at   = new Date().toISOString();
  p.local_time     = new Date().toString();
  p.lang           = S.lang;
  p.site           = CFG.site;
  p.tank           = S.meta.tank;
  p.checked_by     = S.meta.checked_by;
  p.date           = S.meta.date;
  p.time           = S.meta.time;
  p.rain_2days     = S.ans.rain_2days;
  var shown = steps();
  QS.forEach(function(q){
    var v = shown.indexOf(q) > -1 ? S.ans[q.id] : undefined;   // a skipped question is blank, not stale
    if (q.type==='month') v = (v && v.y && v.m) ? v.y+'-'+v.m : '';
    if (Array.isArray(v)) v = v.slice().sort(function(a,b){return a-b;}).join(',');
    p[q.id] = (v===undefined||v===null) ? '' : v;
  });
  p.duration_seconds = S.started ? Math.round((Date.now()-S.started)/1000) : '';
  p.app_version      = CFG.version;
  p.device           = navigator.userAgent;
  return p;
}

function send(payload){
  if (!CFG.endpoint) return Promise.reject(new Error('no endpoint'));
  return fetch(CFG.endpoint, {
    method : 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},  // avoids a CORS preflight
    body   : JSON.stringify({token:CFG.token, fields:FIELDS, row:payload})
  }).then(function(r){
    if (!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(t){
    if (t.indexOf('OK')!==0) throw new Error(t.slice(0,120));
    return true;
  });
}

function submit(){
  var payload = buildPayload();

  if (CFG.sink === 'file'){
    S.savedAs = saveOneToFile(payload);
    var all = queue(); all.push(payload); setQueue(all);   // keeps Export data complete
    clearDraft();
    S.screen='done'; paintChrome(); renderDone();
    return;
  }

  var q = queue();
  q.push(payload);
  setQueue(q);
  clearDraft();
  S.screen='done'; paintChrome(); renderDone();
  flushQueue();               // in the background; the checker never waits on it
}

/* One CSV per sheet, named so a month of them sorts by tank and by date. */
function saveOneToFile(payload){
  var stamp = (payload.date||today()) + ' ' + (payload.time||now()).replace(':','');
  var fname = 'ARC tank ' + (payload.tank||'') + ' - ' + stamp + '.csv';
  download(fname, toCSV([payload]));
  return fname;
}
function download(filename, text){
  var blob = new Blob(['﻿'+text], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* The link at the Ecovillage drops often, so a failed flush retries itself. */
var flushTimer = null, flushWait = 15000, flushing = false;
var FLUSH_MIN = 15000, FLUSH_MAX = 300000;

function scheduleFlush(ms){
  if (flushTimer) clearTimeout(flushTimer);
  flushTimer = setTimeout(flushQueue, ms);
}

function flushQueue(){
  if (CFG.sink === 'file') return;        // nothing is ever uploaded
  if (!CFG.endpoint || flushing) return;
  if (flushTimer){ clearTimeout(flushTimer); flushTimer = null; }

  var q = queue();
  if (!q.length){ flushWait = FLUSH_MIN; return; }
  if (!navigator.onLine){ scheduleFlush(FLUSH_MIN); return; }

  flushing = true;
  send(q[0]).then(function(){
    flushing = false;
    var cur = queue(); cur.shift(); setQueue(cur);
    flushWait = FLUSH_MIN;
    scheduleFlush(600);                       // straight on to the next one
  }).catch(function(){
    flushing = false;
    flushWait = Math.min(flushWait * 2, FLUSH_MAX);
    scheduleFlush(flushWait);                 // back off, but never give up
  });
}

/* ---------- manual export, so nothing is ever stranded ---------- */
function toCSV(rows){
  var out = [FIELDS.join(',')];
  rows.forEach(function(r){
    out.push(FIELDS.map(function(f){
      var v = r[f]==null ? '' : String(r[f]);
      return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
    }).join(','));
  });
  return out.join('\n');
}
function exportQueue(){
  var rows = queue();
  if (!rows.length){ alertish(S.lang==='en'?'Nothing waiting to send.':'Hakuna kilichosalia.'); return; }
  download('arc-tanks-'+today()+'.csv', toCSV(rows));
}

/* ============================================================
   wiring
   ============================================================ */
$next.addEventListener('click', function(){
  if (S.screen==='review'){ submit(); return; }
  go(1);
});
$back.addEventListener('click', function(){
  if (S.screen==='review'){ S.screen='q'; S.i=steps().length-1; render(); return; }
  go(-1);
});
document.getElementById('btn-home').addEventListener('click', function(){
  if (S.screen==='start') return;
  saveDraft();
  S.screen='start'; render();
});
document.addEventListener('keydown', function(e){
  if (S.screen!=='q') return;
  if (e.key==='Enter' && e.target.tagName!=='TEXTAREA' && !$next.disabled){ go(1); }
});

window.addEventListener('online',  function(){ paintOnline(); flushQueue(); });
window.addEventListener('offline', paintOnline);

paintOnline();
paintBadge();
flushQueue();
render();
