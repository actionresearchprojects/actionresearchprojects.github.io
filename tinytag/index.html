<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ARC Tinytag Converter</title>
<script>
(function(){
  if(sessionStorage.getItem('arc_auth')==='1')return;
  var s=document.createElement('style');
  s.textContent='body{visibility:hidden}';
  document.head.appendChild(s);
  document.addEventListener('DOMContentLoaded',function(){
    s.remove();
    var o=document.createElement('div');
    o.id='pw-overlay';
    o.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:#111;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#fff;';
    o.innerHTML='<div style="text-align:center"><div style="font-size:20px;margin-bottom:20px;font-weight:500">Enter password</div><input id="pw-in" type="password" placeholder="Password" style="padding:10px 14px;font-size:16px;background:#222;color:#fff;border:1px solid #555;border-radius:4px;width:220px;outline:none;display:block;margin:0 auto 8px"><div id="pw-err" style="color:#f66;font-size:13px;height:20px"></div><button id="pw-btn" style="padding:10px 28px;background:#fff;color:#111;border:none;border-radius:4px;font-size:15px;cursor:pointer;margin-top:4px">Enter</button></div>';
    document.body.appendChild(o);
    document.getElementById('pw-in').focus();
    async function check(){
      var val=document.getElementById('pw-in').value;
      var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(val));
      var hash=Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
      if(hash==='52e32618b274e60e320245f222a7a50dd485ea0e3edcf48cb2873977502b5f19'){
        sessionStorage.setItem('arc_auth','1');
        o.remove();
      }else{
        document.getElementById('pw-err').textContent='Incorrect password';
      }
    }
    document.getElementById('pw-btn').addEventListener('click',check);
    document.getElementById('pw-in').addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  });
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="any" href="../assets/images/favicon.png">
<link rel="apple-touch-icon" href="../assets/images/favicon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Ubuntu',sans-serif;font-size:13px;background:#f8f9fa;color:#333}
#header{background:#fff;border-bottom:1px solid #ddd;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20;min-height:49px}
#header h1{font-size:17px;font-weight:500;color:#222;white-space:nowrap}
#header .spacer{flex:1}
main{padding:14px;max-width:1000px;margin:0 auto}
.card{background:#fff;border:1px solid #ddd;border-radius:4px;padding:12px;margin-bottom:12px}
button,input{font-family:inherit}
.btn{background:#fff;border:1px solid #bbb;border-radius:3px;padding:4px 10px;cursor:pointer;color:#333;font-size:12px}
.btn:hover{background:#f0f1f2;border-color:#999}
.btn:disabled{opacity:.45;cursor:default;background:#fff;border-color:#bbb}
.btn.primary{background:#1a6b4a;border-color:#1a6b4a;color:#fff}
.btn.primary:hover{background:#155a3e}
.btn.primary:disabled{background:#1a6b4a;border-color:#1a6b4a}
.btn.sm{padding:2px 8px;font-size:11px;line-height:1.5}
#drop{border:2px dashed #c9cdd1;border-radius:4px;padding:48px 16px;text-align:center;cursor:pointer;transition:border-color .12s,background .12s;background:#fbfbfc}
#drop:hover,#drop.over{border-color:#1a6b4a;background:#f1f7f4}
#drop .big{font-size:18px;font-weight:500;color:#222;margin-bottom:8px}
#drop .small{font-size:13px;color:#777}
#drop u{color:#1a6b4a;text-decoration:none;font-weight:500}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:#666}
.who input{font-size:13px;padding:5px 7px;border:1px solid #ccc;border-radius:3px;width:200px;max-width:100%}
.who input:focus{outline:none;border-color:#1a6b4a;box-shadow:0 0 0 2px rgba(26,107,74,.12)}
.hint{font-size:11px;color:#888;line-height:1.5;margin-top:10px}
#status{font-size:13px;margin:0 2px 10px;min-height:18px}
#status.ok{color:#1a6b4a;font-weight:500}
#status.bad{color:#a32b2b}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .name{flex:1;min-width:200px}
.row .t{font-size:14px;font-weight:500;color:#222;word-break:break-word}
.row .f{font-size:11px;color:#888;margin-top:2px;word-break:break-word}
.row .f b{color:#555;font-weight:500}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px;background:#eef0f2;color:#666;white-space:nowrap}
.chip.sending{background:#fff4d6;color:#7a5a00}
.chip.sent{background:#e2f2ea;color:#1a6b4a}
.chip.failed{background:#fbe5e5;color:#a32b2b}
.err{background:#fdf2f2;border-color:#e3c3c3}
.err .t{color:#a32b2b}
.x{background:none;border:none;color:#999;font-size:18px;line-height:1;cursor:pointer;padding:0 2px}
.x:hover{color:#a32b2b}
@media (max-width:560px){
  #header h1{font-size:15px}
  main{padding:10px}
  #drop{padding:34px 12px}
}
</style>
</head>
<body>

<div id="header">
  <h1>Tinytag Converter</h1>
  <div class="spacer"></div>
  <button class="btn" id="btnAll" disabled>Download all (.zip)</button>
</div>

<main>
  <div class="card">
    <div id="drop" tabindex="0" role="button" aria-label="Choose .ttd files">
      <div class="big">Drop Tinytag <b>.ttd</b> files here</div>
      <div class="small">or <u>choose files</u>. As many as you like at once.</div>
    </div>
    <input type="file" id="fileInput" accept=".ttd" multiple hidden>
    <div class="who" id="who" hidden>
      <label for="sender">Your name</label>
      <input type="text" id="sender" placeholder="e.g. Saidi" autocomplete="name">
      <span>(remembered on this computer)</span>
    </div>
    <p class="hint" id="hint"></p>
  </div>
  <div id="status"></div>
  <div id="files"></div>
</main>

<script src="ttd.js"></script>
<script>
(function () {
'use strict';
const { readTtd, readingsTable, toXlsx, toCsvBlob, zip } = window.TTD;

// Google Apps Script web app that saves uploads to the ARC Google Drive (see
// README.md). Leave endpoint blank and the page only converts, sending nothing.
const CFG = {
  endpoint: 'https://script.google.com/macros/s/AKfycbzJcCDM5PEhdYjiMCMehTAMjqEIbl4RZRbiXN5gSlSdCly3kXnpEcZs-PeMKV5rDTEX/exec',
  token: 'arc-tinytag-2026',
};
const SENDS = !!CFG.endpoint;

const items = [];   // { id, file, base, ttd?, error?, sent?: 'waiting'|'sending'|'sent'|'failed', why? }
let uid = 1;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeName = s => s.replace(/[\\/:*?"<>|]+/g, '_').trim() || 'tinytag';

$('#hint').innerHTML = SENDS
  ? 'Each file is converted to Excel (.xlsx) and CSV and <b>sent to the ARC team automatically</b>, so there is no need to email anything. You can also download the converted files here.'
  : 'Each file is converted to Excel (.xlsx) and CSV in your browser. Nothing is uploaded.';

/* ---------- conversion: always every channel, always both formats ---------- */
const all = t => t.channels.map(() => true);
const outputs = it => [
  { name: it.base + '.xlsx', make: () => toXlsx(it.ttd, all(it.ttd)) },
  { name: it.base + '.csv', make: async () => toCsvBlob(readingsTable(it.ttd, all(it.ttd))) },
];

async function addFiles(list) {
  const fresh = [];
  for (const file of list) {
    const it = { id: uid++, file, base: safeName(file.name.replace(/\.ttd$/i, '')) };
    items.push(it); fresh.push(it);
  }
  render();
  for (const it of fresh) {
    try {
      if (!/\.ttd$/i.test(it.file.name)) throw new Error('Not a Tinytag .ttd file, so it was skipped.');
      it.ttd = await readTtd(await it.file.arrayBuffer());
      if (SENDS) it.sent = 'waiting';
    } catch (e) {
      it.error = e.message || String(e);
    }
    render();
  }
  pump();
}

/* ---------- sending ---------- */
const toB64 = blob => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(',')[1] || '');
  r.onerror = () => rej(r.error);
  r.readAsDataURL(blob);
});

async function sendOne(it) {
  const files = [{ name: it.file.name, mime: 'application/octet-stream', b64: await toB64(it.file) }];
  for (const o of outputs(it)) {
    const b = await o.make();
    files.push({ name: o.name, mime: b.type, b64: await toB64(b) });
  }
  const r = await fetch(CFG.endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },  // avoids a CORS preflight
    body: JSON.stringify({ token: CFG.token, sender: $('#sender').value.trim(), files }),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const t = await r.text();
  if (t.indexOf('OK') !== 0) throw new Error(t.slice(0, 160));
}

// One upload at a time, in the order the files were dropped.
let pumping = false;
async function pump() {
  if (!SENDS || pumping) return;
  pumping = true;
  try {
    let it;
    while ((it = items.find(x => x.sent === 'waiting'))) {
      it.sent = 'sending'; render();
      try { await sendOne(it); it.sent = 'sent'; }
      catch (e) { it.sent = 'failed'; it.why = e.message || String(e); }
      render();
    }
  } finally { pumping = false; }
}

/* ---------- downloads ---------- */
function save(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function downloadAll() {
  const ready = items.filter(it => it.ttd);
  if (!ready.length) return;
  const btn = $('#btnAll'); btn.disabled = true; btn.textContent = 'Preparing…';
  try {
    const used = {}, entries = [];
    for (const it of ready) for (const o of outputs(it)) {
      let name = o.name;
      if (used[name]) { const dot = name.lastIndexOf('.'); name = name.slice(0, dot) + ' (' + (++used[o.name]) + ')' + name.slice(dot); }
      else used[name] = 1;
      entries.push({ name, data: new Uint8Array(await (await o.make()).arrayBuffer()) });
    }
    save(await zip(entries), 'tinytag-converted.zip');
  } finally { btn.textContent = 'Download all (.zip)'; render(); }
}

/* ---------- rendering ---------- */
const CHIP = { waiting: 'Waiting to send', sending: 'Sending…', sent: 'Sent to ARC ✓', failed: 'Not sent' };

function card(it) {
  const x = `<button class="x" data-remove="${it.id}" title="Remove from list" aria-label="Remove">×</button>`;
  if (it.error) {
    return `<div class="card err"><div class="row"><div class="name"><div class="t">${esc(it.file.name)}</div><div class="f">${esc(it.error)}</div></div>${x}</div></div>`;
  }
  if (!it.ttd) {
    return `<div class="card"><div class="row"><div class="name"><div class="t">${esc(it.file.name)}</div><div class="f">Converting…</div></div></div></div>`;
  }
  const t = it.ttd, r = t.readings;
  const serials = [...new Set(t.channels.map(c => c.serial).filter(Boolean))].join(', ');
  const facts = [
    serials && `Logger <b>${esc(serials)}</b>`,
    `<b>${r.length.toLocaleString()}</b> readings`,
    r.length && `<b>${esc(r[0].time.slice(0, 10))}</b> to <b>${esc(r[r.length - 1].time.slice(0, 10))}</b>`,
  ].filter(Boolean).join(' · ');
  const chip = it.sent ? `<span class="chip ${it.sent}" ${it.why ? `title="${esc(it.why)}"` : ''}>${CHIP[it.sent]}</span>` : '';
  const retry = it.sent === 'failed' ? `<button class="btn primary sm" data-retry="${it.id}">Try again</button>` : '';
  return `<div class="card"><div class="row">
    <div class="name"><div class="t">${esc(t.title || it.base)}</div><div class="f">${esc(it.file.name)} · ${facts}</div></div>
    <div class="acts">${chip}${retry}<button class="btn sm" data-dl="${it.id}:0">.xlsx</button><button class="btn sm" data-dl="${it.id}:1">.csv</button>${it.sent === 'sending' ? '' : x}</div>
  </div></div>`;
}

function render() {
  $('#files').innerHTML = items.slice().reverse().map(card).join('');
  $('#btnAll').disabled = !items.some(it => it.ttd);
  const st = $('#status');
  const n = k => items.filter(it => it.sent === k).length;
  const done = n('sent'), fail = n('failed'), left = n('waiting') + n('sending');
  const conv = items.filter(it => it.ttd).length, bad = items.filter(it => it.error).length;
  st.className = '';
  if (!items.length) st.textContent = '';
  else if (!SENDS) st.textContent = `${conv} converted` + (bad ? `, ${bad} skipped` : '') + '.';
  else if (left) st.textContent = `Sending to ARC… ${done} of ${done + fail + left} sent. Keep this page open.`;
  else if (fail) { st.className = 'bad'; st.innerHTML = `${done} sent, ${fail} not sent. Check the internet connection, then <button class="btn primary sm" id="retryAll">Try again</button>`; }
  else if (done) { st.className = 'ok'; st.textContent = `All done: ${done} file${done === 1 ? '' : 's'} sent to ARC. Nothing else to do.`; }
}

/* ---------- events ---------- */
const drop = $('#drop'), input = $('#fileInput');
drop.addEventListener('click', () => input.click());
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
input.addEventListener('change', () => { addFiles([...input.files]); input.value = ''; });
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  if (ev === 'dragleave' && e.relatedTarget) return;
  e.preventDefault(); drop.classList.remove('over');
}));
document.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]); });
$('#btnAll').addEventListener('click', downloadAll);
$('#status').addEventListener('click', e => {
  if (!e.target.closest('#retryAll')) return;
  items.forEach(it => { if (it.sent === 'failed') { it.sent = 'waiting'; it.why = ''; } });
  render(); pump();
});

$('#files').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  const id = +(b.dataset.remove || b.dataset.retry || (b.dataset.dl || '').split(':')[0]);
  const it = items.find(x => x.id === id);
  if (!it) return;
  if (b.dataset.remove) { items.splice(items.indexOf(it), 1); render(); }
  else if (b.dataset.retry) { it.sent = 'waiting'; it.why = ''; render(); pump(); }
  else if (b.dataset.dl) { const o = outputs(it)[+b.dataset.dl.split(':')[1]]; save(await o.make(), o.name); }
});

if (SENDS) {
  $('#who').hidden = false;
  try { $('#sender').value = localStorage.getItem('arc-tinytag-sender') || ''; } catch (e) {}
  $('#sender').addEventListener('input', () => {
    try { localStorage.setItem('arc-tinytag-sender', $('#sender').value.trim()); } catch (e) {}
  });
  window.addEventListener('beforeunload', e => {
    if (items.some(it => it.sent === 'waiting' || it.sent === 'sending')) { e.preventDefault(); e.returnValue = ''; }
  });
}
})();
</script>
</body>
</html>
