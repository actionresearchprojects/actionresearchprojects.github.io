:root{
  --green:#1a6b4a; --green-d:#125239; --green-l:#e7f2ec;
  --ink:#1c2321; --muted:#5d6b66; --line:#d6ded9; --bg:#f4f7f5; --card:#fff;
  --s3:#2b6cb0; --s2:#3182ce; --s1:#5b9bd5; --s0:#38a169;
  --p1:#d99a3c; --p2:#ed8936; --p3:#e53e3e;
  --yes:#2f855a; --no:#b03a3a;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Ubuntu',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  font-size:17px;line-height:1.35;overscroll-behavior:none;
}
button,input,textarea,select{font-family:inherit}
.hide{display:none !important}

/* ---------- shell ---------- */
#app{min-height:100%;min-height:100dvh;display:flex;flex-direction:column}
#bar{
  background:var(--green);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
#bar .who{font-size:15px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar .step{font-size:14px;opacity:.85;font-variant-numeric:tabular-nums}
#bar button{
  background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:10px;
  padding:8px 12px;font-size:14px;font-weight:500;cursor:pointer;
}
#bar button:active{background:rgba(255,255,255,.3)}
#prog{height:6px;background:rgba(0,0,0,.12);flex-shrink:0}
#prog>i{display:block;height:100%;background:#8fd6b4;width:0;transition:width .25s ease}

#stage{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 14px 8px;display:flex;justify-content:center}
#stage>.wrap{width:100%;max-width:960px;display:flex;flex-direction:column}

#foot{
  flex-shrink:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:10px;background:var(--bg);border-top:1px solid var(--line);
}
#foot button{
  flex:1;border:none;border-radius:14px;padding:18px 14px;font-size:19px;font-weight:500;cursor:pointer;
}
#btn-back{flex:0 0 33%;background:#e3e9e6;color:var(--muted)}
#btn-next{background:var(--green);color:#fff;box-shadow:0 2px 0 var(--green-d)}
#btn-next:disabled{background:#c3cdc8;box-shadow:none;color:#fff}
#btn-next:active:not(:disabled){transform:translateY(1px);box-shadow:none}

/* ---------- question ---------- */
.sec{
  display:inline-block;align-self:flex-start;background:var(--green-l);color:var(--green-d);
  font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;margin-bottom:12px;
}
.q-sw{font-size:29px;font-weight:500;line-height:1.2;margin-bottom:4px}
.q-en{font-size:20px;font-weight:300;color:var(--muted);line-height:1.25;margin-bottom:4px}
.q-hint{font-size:15px;color:var(--muted);margin-top:8px;font-style:italic}
.q-head{margin-bottom:20px}

/* option grids */
.opts{display:grid;gap:11px;margin-bottom:6px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.gauto{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

.opt{
  background:var(--card);border:3px solid var(--line);border-radius:var(--r);
  padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  gap:8px;text-align:center;transition:border-color .12s,background .12s,transform .08s;
  color:var(--muted);min-height:118px;justify-content:center;
}
.opt:active{transform:scale(.97)}
.opt svg{width:56px;height:56px;flex-shrink:0;display:block}
.opt .lab-sw{font-size:18px;font-weight:500;color:var(--ink);line-height:1.15}
.opt .lab-en{font-size:14px;font-weight:300;color:var(--muted);line-height:1.15}
.opt.on{border-color:currentColor;background:#fff;box-shadow:0 0 0 4px rgba(0,0,0,.06)}
.opt.on{box-shadow:0 0 0 4px color-mix(in srgb,currentColor 16%,transparent)}
.opt.on .lab-sw{color:currentColor}

/* 7-point scale */
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.scale .opt{padding:12px 4px;min-height:132px;gap:6px}
.scale .opt svg{width:48px;height:48px}
.scale .opt .lab-sw{font-size:14px}
.scale .opt .lab-en{font-size:12px}
.scale .num{
  font-size:13px;font-weight:700;color:currentColor;border-radius:999px;
  background:#eef1f0;
  background:color-mix(in srgb,currentColor 18%,#fff);
  padding:2px 9px;font-variant-numeric:tabular-nums;line-height:1.3;
}

/* yes / no */
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn .opt{min-height:140px}
.yn .opt svg{width:64px;height:64px}
.yn .opt .lab-sw{font-size:24px}

/* counter */
.counter{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0 18px}
.counter button{
  width:82px;height:82px;border-radius:50%;border:3px solid var(--green);background:#fff;
  color:var(--green);font-size:40px;font-weight:300;cursor:pointer;line-height:1;
}
.counter button:active{background:var(--green-l)}
.counter .val{
  font-size:64px;font-weight:500;min-width:110px;text-align:center;font-variant-numeric:tabular-nums;
}
/* text */
textarea,input[type=text]{
  width:100%;border:3px solid var(--line);border-radius:var(--r);padding:14px;
  font-size:21px;background:#fff;color:var(--ink);outline:none;resize:vertical;
}
textarea:focus,input[type=text]:focus{border-color:var(--green)}
textarea{min-height:150px;line-height:1.4}
.locked{background:#eef2f0;color:var(--muted);pointer-events:none}
.lock-note{font-size:14px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:flex-start}

/* chips (roster / rooms) */
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px}
.chip{
  background:#fff;border:3px solid var(--line);border-radius:999px;padding:12px 20px;
  font-size:19px;cursor:pointer;color:var(--ink);
}
.chip.on{border-color:var(--green);background:var(--green-l);color:var(--green-d);font-weight:500}

/* ---------- start / review / done ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.panel h2{font-size:22px;font-weight:500;margin-bottom:4px}
.panel p.sub{font-size:15px;color:var(--muted);margin-bottom:14px}
.field{margin-bottom:16px}
.field>label{display:block;font-size:15px;font-weight:500;margin-bottom:8px;color:var(--muted)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo .mark{width:46px;height:46px;border-radius:12px;background:var(--green);display:grid;place-items:center;flex-shrink:0}
.logo .mark svg{width:28px;height:28px;color:#fff}
.logo h1{font-size:25px;font-weight:500;line-height:1.15}
.logo .sub{font-size:14px;color:var(--muted)}

.review{list-style:none}
.review li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px;align-items:flex-start}
.review li:last-child{border-bottom:none}
.review .rq{flex:1;color:var(--muted)}
.review .ra{font-weight:500;text-align:right;max-width:52%;word-break:break-word}
.review .ra.empty{color:#b4bfba;font-weight:300}
.review li button{background:none;border:none;color:var(--green);font-size:14px;cursor:pointer;padding:2px 4px;text-decoration:underline}

.done-mark{width:110px;height:110px;margin:26px auto 18px;display:block;color:var(--green)}
.done h2{text-align:center;font-size:30px;font-weight:500;margin-bottom:8px}
.done p{text-align:center;color:var(--muted);font-size:17px;margin-bottom:22px}

.note{background:#fff8e6;border:1px solid #e8d49a;border-radius:12px;padding:12px 14px;font-size:14.5px;color:#6b5626;margin-bottom:14px}
.note.bad{background:#fdeceb;border-color:#e8b0ab;color:#83302a}
.note.ok{background:var(--green-l);border-color:#a9cfbc;color:var(--green-d)}
.queue-badge{background:#fff;color:var(--green-d);border-radius:999px;padding:3px 9px;font-size:13px;font-weight:500}
.offdot{background:rgba(0,0,0,.22);color:#ffd9a0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;white-space:nowrap}

.mini{display:flex;gap:8px;flex-wrap:wrap}
.mini button{
  background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 14px;
  font-size:14px;cursor:pointer;color:var(--muted);
}
.mini button:active{background:var(--green-l)}

/* ---------- responsive ---------- */
@media (max-width:820px){
  .scale{grid-template-columns:repeat(4,1fr)}
  .scale .opt{min-height:118px}
}
@media (max-width:560px){
  body{font-size:16px}
  .q-sw{font-size:25px}
  .q-en{font-size:17px}
  .scale{grid-template-columns:repeat(2,1fr)}
  .scale .opt{min-height:112px;flex-direction:row;justify-content:flex-start;padding:10px 12px;gap:10px;text-align:left}
  .scale .opt svg{width:44px;height:44px}
  .scale .opt .lab-sw{font-size:16px}
  .scale .opt .txt{display:flex;flex-direction:column;gap:2px}
  .g3{grid-template-columns:repeat(2,1fr)}
  .counter button{width:72px;height:72px;font-size:34px}
  .counter .val{font-size:54px}
}
@media (min-width:821px){
  .scale .opt .txt{display:contents}
}
@media (max-width:560px){
  .scale .num{align-self:flex-start}
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function pad(n){ return (n<10?'0':'')+n; }
function today(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function now(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function icon(id,cls){ return '<svg class="'+(cls||'')+'"><use href="#'+id+'"/></svg>'; }

/* bilingual label: returns the two lines the current language setting wants */
function lines(q, key){
  var self = S.mode==='self';
  var sw = (self && q[key+'Self'] ? q[key+'Self'] : q[key]) || '';
  var enKey = key==='sw' ? 'en' : (key==='hintSw' ? 'hintEn' : null);
  var en = '';
  if (enKey) en = (self && q[enKey+'Self'] ? q[enKey+'Self'] : q[enKey]) || '';
  return {sw:sw, en:en};
}
function qTitleHTML(q){
  var L = lines(q,'sw');
  if (S.lang==='sw') return '<div class="q-sw">'+esc(L.sw)+'</div>';
  if (S.lang==='en') return '<div class="q-sw">'+esc(L.en)+'</div>';
  return '<div class="q-sw">'+esc(L.sw)+'</div><div class="q-en">'+esc(L.en)+'</div>';
}
function qHintHTML(q){
  var L = lines(q,'hintSw');
  if (!L.sw && !L.en) return '';
  var txt = S.lang==='en' ? L.en : (S.lang==='sw' ? L.sw : L.sw+' &nbsp;·&nbsp; '+L.en);
  return '<div class="q-hint">'+txt+'</div>';
}
function optLabelHTML(o){
  if (S.lang==='sw') return '<span class="lab-sw">'+esc(o.sw)+'</span>';
  if (S.lang==='en') return '<span class="lab-sw">'+esc(o.en)+'</span>';
  return '<span class="lab-sw">'+esc(o.sw)+'</span><span class="lab-en">'+esc(o.en)+'</span>';
}

/* ============================================================
   which questions apply
   ============================================================ */
function steps(){
  return QS.filter(function(q){
    if (q.surveyorOnly && S.mode!=='surveyor') return false;
    if (q.showIf && !q.showIf(S.ans)) return false;
    return true;
  });
}
/* Options an option-level showIf currently allows. Used everywhere options are
   drawn or read back, so a hidden option can never be rendered or scored. */
function opts(q){
  if (!q.opts) return [];
  return q.opts.filter(function(o){ return !o.showIf || o.showIf(S.ans); });
}

/* If an earlier answer changes so that a chosen option no longer applies,
   drop it rather than silently keeping an answer the surveyor cannot see. */
function pruneHidden(q){
  if (!q.opts) return;
  var allowed = opts(q).map(function(o){ return o.v; });
  var v = S.ans[q.id];
  if (Array.isArray(v)){
    var kept = v.filter(function(x){ return allowed.indexOf(x) > -1; });
    if (kept.length !== v.length) S.ans[q.id] = kept;
  } else if (v !== undefined && v !== null && v !== '' && allowed.indexOf(v) === -1){
    delete S.ans[q.id];
  }
}

function answered(q){
  var v = S.ans[q.id];
  if (q.type==='multi') return Array.isArray(v) && v.length>0;
  if (q.type==='text')  return typeof v==='string' && v.trim()!=='';
  return v !== undefined && v !== null && v !== '';
}

function saveDraft(){
  try{ localStorage.setItem(LS_DRAFT, JSON.stringify({
    lang:S.lang, mode:S.mode, meta:S.meta, ans:S.ans, i:S.i,
    started:S.started, primed:S.primed, at:Date.now()
  })); }catch(e){}
}
function clearDraft(){ try{ localStorage.removeItem(LS_DRAFT); }catch(e){} }
function loadDraft(){ try{ var s=localStorage.getItem(LS_DRAFT); return s?JSON.parse(s):null; }catch(e){ return null; } }
function prefs(){ try{ return JSON.parse(localStorage.getItem(LS_PREFS))||{}; }catch(e){ return {}; } }
function savePrefs(p){ try{ localStorage.setItem(LS_PREFS, JSON.stringify(p)); }catch(e){} }
function queue(){ try{ return JSON.parse(localStorage.getItem(LS_QUEUE))||[]; }catch(e){ return []; } }
function setQueue(q){ try{ localStorage.setItem(LS_QUEUE, JSON.stringify(q)); }catch(e){} paintBadge(); paintDoneStatus(); }
function paintBadge(){
  var n = queue().length;
  $badge.classList.toggle('hide', n===0);
  $badge.textContent = n + ' ⏳';

}

function paintChrome(){
  var st = steps(), on = S.screen==='q';
  $stepno.textContent = on ? (S.i+1)+' / '+st.length : '';
  $prog.style.width = on ? ((S.i)/st.length*100)+'%' : (S.screen==='done'?'100%':'0%');
  var bits=[];
  if (S.meta.name) bits.push(S.meta.name);
  if (S.screen!=='start') bits.push(S.mode==='self' ? 'mwenyewe' : 'msaidizi');
  $who.textContent = bits.join(' · ');
  $foot.classList.toggle('hide', S.screen==='start' || S.screen==='done');
  paintBadge();
}

function alertish(msg){
  var n=document.createElement('div');
  n.textContent=msg;
  n.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b2f2d;color:#fff;padding:14px 20px;border-radius:12px;font-size:16px;z-index:9999;max-width:88%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)';
  document.body.appendChild(n);
  setTimeout(function(){ n.remove(); }, 2600);
}

/* ---------- a question ---------- */
function renderQ(){
  var st = steps();
  if (S.i >= st.length){ S.screen='review'; render(); return; }
  var q = st[S.i];

  if (q.primes) S.primed = true;   // the 7-point scale has now been seen
  pruneHidden(q);

  var sec = SEC_NAME[q.sec];
  var secTxt = S.lang==='en' ? sec.en : (S.lang==='sw' ? sec.sw : sec.sw);
  var html = '<div class="sec">'+esc(secTxt)+'</div><div class="q-head">'+qTitleHTML(q)+qHintHTML(q)+'</div>';

  if (q.type==='scale')       html += scaleHTML(q);
  else if (q.type==='choice') html += choiceHTML(q);
  else if (q.type==='multi')  html += multiHTML(q);
  else if (q.type==='count')  html += countHTML(q);
  else if (q.type==='text')   html += textHTML(q);

  $wrap.innerHTML = html;
  wire(q);

  $back.disabled = false;
  $next.textContent = (S.i===st.length-1)
    ? (S.lang==='en' ? 'Check answers' : 'Angalia majibu')
    : (S.lang==='en' ? 'Next' : 'Endelea');
  $next.disabled = !(answered(q) || q.optional);
}

function optHTML(q,o,on,extra){
  return '<button class="opt'+(on?' on':'')+'" data-v="'+esc(o.v)+'" style="color:'+(o.c||'var(--green)')+'">'+
         icon(o.icon)+(extra||'')+optLabelHTML(o)+'</button>';
}
function scaleHTML(q){
  var cur = S.ans[q.id];
  return '<div class="opts scale">'+opts(q).map(function(o){
    var num = '<span class="num">'+(o.v>0?'+':'')+o.v+'</span>';
    var on = cur===o.v;
    return '<button class="opt'+(on?' on':'')+'" data-v="'+o.v+'" style="color:'+o.c+'">'+
           icon(o.icon)+'<span class="txt">'+num+optLabelHTML(o)+'</span></button>';
  }).join('')+'</div>';
}
function choiceHTML(q){
  var cur = S.ans[q.id];
  var cls = q.layout==='yn' ? 'yn' : 'opts '+(q.layout||'gauto');
  return '<div class="'+cls+'">'+opts(q).map(function(o){
    return optHTML(q,o,String(cur)===String(o.v));
  }).join('')+'</div>';
}
function multiHTML(q){
  var cur = S.ans[q.id]||[];
  return '<div class="opts '+(q.layout||'gauto')+'">'+opts(q).map(function(o){
    return optHTML(q,o,cur.indexOf(o.v)>-1);
  }).join('')+'</div>';
}
function countHTML(q){
  var v = S.ans[q.id];
  if (v===undefined) v = (q.start!==undefined ? q.start : 0);
  return '<div class="counter">'+
    '<button data-d="-1" aria-label="minus">&minus;</button>'+
    '<div class="val" id="cval" style="color:var(--green-d)">'+v+'</div>'+
    '<button data-d="1" aria-label="plus">+</button></div>'+
    '<div style="display:grid;place-items:center;color:var(--green);opacity:.5">'+icon(q.icon||'i-people')+'</div>';
}
function textHTML(q){
  var v = S.ans[q.id]||'';
  var locked = q.noPrime && S.primed && v.trim()!=='';
  var note = '';
  if (locked){
    note = '<div class="lock-note">&#128274; '+
      (S.lang==='en' ? 'Locked — her own words were recorded before the seven choices were shown.'
                     : 'Imefungwa &middot; maneno yake yalihifadhiwa kabla ya kuonyesha chaguo saba.')+'</div>';
  }
  return '<textarea id="ta"'+(locked?' readonly class="locked"':'')+
    ' placeholder="'+(S.lang==='en'?'Type here…':'Andika hapa…')+'">'+esc(v)+'</textarea>'+note;
}

function wire(q){
  $wrap.onclick = null;
  if (q.type==='scale' || q.type==='choice'){
    $wrap.onclick = function(e){
      var b=e.target.closest('.opt'); if(!b) return;
      var raw=b.dataset.v;
      var o = q.opts.filter(function(x){ return String(x.v)===raw; })[0];
      S.ans[q.id] = o.v;
      Array.prototype.forEach.call($wrap.querySelectorAll('.opt'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      $next.disabled = false;
      saveDraft();
      setTimeout(function(){ if (S.screen==='q' && steps()[S.i]===q) go(1); }, 280);
    };
  }
  if (q.type==='multi'){
    $wrap.onclick = function(e){
      var b=e.target.closest('.opt'); if(!b) return;
      var raw=b.dataset.v;
      var o = q.opts.filter(function(x){ return String(x.v)===raw; })[0];
      var cur = (S.ans[q.id]||[]).slice();
      var k = cur.indexOf(o.v);
      if (k>-1){
        cur.splice(k,1);
      } else if (o.exclusive){
        cur = [o.v];                       // "None of these" stands alone
      } else {
        cur = cur.filter(function(v){       // anything else clears it
          var x = q.opts.filter(function(y){ return y.v===v; })[0];
          return !(x && x.exclusive);
        });
        cur.push(o.v);
      }
      S.ans[q.id]=cur;
      Array.prototype.forEach.call($wrap.querySelectorAll('.opt'), function(el){
        var o2 = opts(q).filter(function(y){ return String(y.v)===el.dataset.v; })[0];
        el.classList.toggle('on', !!o2 && cur.indexOf(o2.v) > -1);
      });
      $next.disabled = !(cur.length>0 || q.optional);
      saveDraft();
    };
  }
  if (q.type==='count'){
    var v = S.ans[q.id];
    if (v===undefined) v = (q.start!==undefined ? q.start : 0);
    S.ans[q.id]=v; $next.disabled=false;
    $wrap.onclick = function(e){
      var b=e.target.closest('[data-d]'); if(!b) return;
      var d=parseInt(b.dataset.d,10);
      var n=Math.max(0, Math.min(q.max||20, (S.ans[q.id]||0)+d));
      S.ans[q.id]=n;
      document.getElementById('cval').textContent=n;
      saveDraft();
    };
  }
  if (q.type==='text'){
    var ta=document.getElementById('ta');
    ta.addEventListener('input', function(){
      S.ans[q.id]=this.value;
      $next.disabled = !(this.value.trim()!=='' || q.optional);
      saveDraft();
    });
    if (!ta.readOnly && !('ontouchstart' in window)) ta.focus();
  }
}

function go(d){
  var st = steps();
  if (d>0){
    var q = st[S.i];
    if (q && !answered(q) && !q.optional){ return; }
    if (S.i >= st.length-1){ S.screen='review'; saveDraft(); render(); return; }
    S.i++;
  } else {
    if (S.i===0){ S.screen='start'; saveDraft(); render(); return; }
    S.i--;
  }
  saveDraft(); render();
}

/* ---------- review ---------- */
function shortAnswer(q){
  var v = S.ans[q.id];
  if (v===undefined || v===null || v==='' || (Array.isArray(v)&&!v.length)) return null;
  if (q.type==='text')  return v;
  if (q.type==='count') return String(v);
  if (q.type==='multi'){
    return v.map(function(x){
      var o=opts(q).filter(function(y){return y.v===x;})[0];
      return o ? (S.lang==='en'?o.en:o.sw) : x;
    }).join(', ');
  }
  var o = q.opts.filter(function(y){ return String(y.v)===String(v); })[0];
  if (!o) return String(v);
  var lab = S.lang==='en' ? o.en : o.sw;
  return (q.type==='scale' ? (o.v>0?'+':'')+o.v+'  ' : '') + lab;
}

function renderReview(){
  var st = steps();
  var rows = st.map(function(q,k){
    var a = shortAnswer(q);
    var L = lines(q,'sw');
    var qt = S.lang==='en' ? L.en : L.sw;
    return '<li><span class="rq">'+esc(qt)+'</span>'+
      '<span class="ra'+(a?'':' empty')+'">'+esc(a || (S.lang==='en'?'—':'—'))+'</span>'+
      '<button data-k="'+k+'">'+(S.lang==='en'?'edit':'badili')+'</button></li>';
  }).join('');

  var q = queue().length;
  $wrap.innerHTML =
    '<div class="sec">'+(S.lang==='en'?'Check before sending':'Angalia kabla ya kutuma')+'</div>'+
    '<div class="q-head">'+
      '<div class="q-sw">'+esc(S.meta.name)+'</div>'+
      '<div class="q-en">'+esc(S.meta.date)+' &middot; '+esc(S.meta.time)+
      (S.meta.asked_by ? ' &middot; '+esc(S.meta.asked_by) : '')+'</div></div>'+
    (q ? '<div class="note">'+q+' '+(S.lang==='en'?'earlier survey(s) still waiting to be sent.':'utafiti uliopita bado haujatumwa.')+'</div>' : '')+
    '<div class="panel"><ul class="review" id="rev">'+rows+'</ul></div>';

  document.getElementById('rev').addEventListener('click', function(e){
    var b=e.target.closest('[data-k]'); if(!b) return;
    S.i = parseInt(b.dataset.k,10); S.screen='q'; render();
  });

  $back.disabled=false;
  $next.disabled=false;
  $next.textContent = S.lang==='en' ? 'Send' : 'Tuma';
}

/* ---------- done ---------- */
function doneStatusText(){
  var n = queue().length;
  if (n === 0) return S.lang==='en' ? 'Sent.' : 'Imetumwa.';
  if (navigator.onLine) return S.lang==='en' ? 'Saved. Sending…' : 'Imehifadhiwa. Inatumwa…';
  return S.lang==='en' ? 'Saved on this device. It will send itself when there is internet.'
                       : 'Imehifadhiwa kwenye kifaa hiki. Itatumwa yenyewe kukiwa na intaneti.';
}
function paintDoneStatus(){
  var el = document.getElementById('done-status');
  if (el) el.textContent = doneStatusText();
}
function renderDone(){
  $wrap.innerHTML =
    '<div class="done">'+icon('i-done','done-mark')+
    '<h2>'+(S.lang==='en'?'Thank you!':'Asante sana!')+'</h2>'+
    '<p id="done-status">'+esc(doneStatusText())+'</p>'+
    '<button id="btn-again" style="border:none;border-radius:16px;padding:20px;font-size:21px;font-weight:500;background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d);cursor:pointer;width:100%">'+
      (S.lang==='en'?'Next girl':'Msichana mwingine')+'</button>'+
    '<div class="mini" style="margin-top:18px;justify-content:center">'+
      '<button id="btn-export2">'+(S.lang==='en'?'Export data':'Hifadhi nakala')+' ('+queue().length+')</button></div>'+
    '</div>';
  document.getElementById('btn-again').addEventListener('click', function(){
    S.ans={}; S.i=0; S.primed=false; S.meta.name=''; S.meta.time=now(); S.meta.date=today();
    S.screen='start'; clearDraft(); render();
  });
  document.getElementById('btn-export2').addEventListener('click', exportQueue);
}

/* ============================================================
   submission
   ============================================================ */
function buildPayload(){
  var p = {};
  p.submitted_at   = new Date().toISOString();
  p.local_time     = new Date().toString();
  p.mode           = S.mode;
  p.lang           = S.lang;
  p.house          = CFG.house;
  p.name           = S.meta.name;
  p.asked_by       = S.meta.asked_by;
  p.date           = S.meta.date;
  p.time           = S.meta.time;
  QS.forEach(function(q){
    var v = S.ans[q.id];
    if (Array.isArray(v)) v = v.slice().sort(function(a,b){return a-b;}).join(',');
    p[q.id] = (v===undefined||v===null) ? '' : v;
  });
  p.duration_seconds = S.started ? Math.round((Date.now()-S.started)/1000) : '';
  p.app_version      = CFG.version;
  p.device           = navigator.userAgent;
  return p;
}

function send(payload){
  if (!CFG.endpoint) return Promise.reject(new Error('no endpoint'));
  return fetch(CFG.endpoint, {
    method : 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},  // avoids a CORS preflight
    body   : JSON.stringify({token:CFG.token, fields:FIELDS, row:payload})
  }).then(function(r){
    if (!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(t){
    if (t.indexOf('OK')!==0) throw new Error(t.slice(0,120));
    return true;
  });
}

function submit(){
  var q = queue();
  q.push(buildPayload());
  setQueue(q);
  clearDraft();
  S.screen='done'; paintChrome(); renderDone();
  flushQueue();               // in the background; the surveyor never waits on it
}

/* The link at House 5 drops often and a submission can take 20s, so a failed
   flush must retry itself. Without this a survey could sit in the queue until
   someone happened to reload the page. */
var flushTimer = null, flushWait = 15000, flushing = false;
var FLUSH_MIN = 15000, FLUSH_MAX = 300000;

function scheduleFlush(ms){
  if (flushTimer) clearTimeout(flushTimer);
  flushTimer = setTimeout(flushQueue, ms);
}

function flushQueue(){
  if (!CFG.endpoint || flushing) return;
  if (flushTimer){ clearTimeout(flushTimer); flushTimer = null; }

  var q = queue();
  if (!q.length){ flushWait = FLUSH_MIN; return; }
  if (!navigator.onLine){ scheduleFlush(FLUSH_MIN); return; }

  flushing = true;
  send(q[0]).then(function(){
    flushing = false;
    var cur = queue(); cur.shift(); setQueue(cur);
    flushWait = FLUSH_MIN;
    scheduleFlush(600);                       // straight on to the next one
  }).catch(function(){
    flushing = false;
    flushWait = Math.min(flushWait * 2, FLUSH_MAX);
    scheduleFlush(flushWait);                 // back off, but never give up
  });
}

/* ---------- manual export, so nothing is ever stranded ---------- */
function toCSV(rows){
  var out = [FIELDS.join(',')];
  rows.forEach(function(r){
    out.push(FIELDS.map(function(f){
      var v = r[f]==null ? '' : String(r[f]);
      return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
    }).join(','));
  });
  return out.join('\n');
}
function exportQueue(){
  var rows = queue();
  if (!rows.length){ alertish(S.lang==='en'?'Nothing waiting to send.':'Hakuna kilichosalia.'); return; }
  var blob = new Blob(['﻿'+toCSV(rows)], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'arc-house5-survey-'+today()+'.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ============================================================
   wiring
   ============================================================ */
$next.addEventListener('click', function(){
  if (S.screen==='review'){ submit(); return; }
  go(1);
});
$back.addEventListener('click', function(){
  if (S.screen==='review'){ S.screen='q'; S.i=steps().length-1; render(); return; }
  go(-1);
});
document.getElementById('btn-home').addEventListener('click', function(){
  if (S.screen==='start') return;
  saveDraft();
  S.screen='start'; render();
});
window.addEventListener('online', flushQueue);
document.addEventListener('keydown', function(e){
  if (S.screen!=='q') return;
  if (e.key==='Enter' && e.target.tagName!=='TEXTAREA' && !$next.disabled){ go(1); }
});

/* ---------- offline ---------- */

function paintOnline(){
  var off = !navigator.onLine, el = document.getElementById('offdot');
  el.classList.toggle('hide', !off);
  el.textContent = '\u25CF ' + (S.lang==='en' ? 'offline' : 'nje ya mtandao');
}
window.addEventListener('online',  function(){ paintOnline(); flushQueue(); });
window.addEventListener('offline', paintOnline);

paintOnline();
paintBadge();
flushQueue();
render();
</script>
